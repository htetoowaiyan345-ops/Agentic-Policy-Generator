# Burmese synonym data, mirroring English BRAIN_LABEL_ROWS and SECTION_HEADING_SYNONYMS.
#
# Two sections:
#   headings.slots: Burmese phrases for section headings (slots 5-14).
#                    Mirrors SECTION_HEADING_SYNONYMS in section_map.py.
#   labels:         Burmese phrases for label-row keys (slots 1, 2, 3, 4, 11).
#                    Mirrors BRAIN_LABEL_ROWS in brain_fields.py.
#
# Keys in 'labels' are snake_case versions of the English canonical label.
# The loader maps them back to the English canonical ('Type:', 'Policy Title:', etc.).
# This ensures canonical_label() returns the same string for either language.

